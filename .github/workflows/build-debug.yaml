name: Build-Debug

# Builds and tests every push to main and every pull request (docs/Design.md §4.4):
#   Windows  build and test Preferis.Windows.slnf (Debug and Release), then the NativeAOT publish and the packages
#            of PackageWindows for win-x64 and win-arm64 (the same ones build-release.yaml ships)
#   macOS    build and test Preferis.MacOS.slnf (Debug and Release), then PackageMacOS (ad-hoc signed)
# The packages stay attached to the run for a few days so a change can be tried without a release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same branch or pull request supersedes the build that is still running.
concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: windows (${{ matrix.rid }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    # x64 image with the ARM64 C++ build tools: NativeAOT cross-compiles between Windows architectures.
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      # The tests do not depend on the target architecture; one run per configuration is enough. The solution lists
      # only the x64 and ARM64 platforms, and without a choice MSBuild takes ARM64, which the WinUI projects reject
      # on an x64 host (NETSDK1032); the Platform must be named.
      - run: dotnet build Preferis.Windows.slnf -c Debug -p:Platform=x64
        if: ${{ matrix.rid == 'win-x64' }}
      - run: dotnet test Preferis.Windows.slnf -c Debug --no-build -p:Platform=x64
        if: ${{ matrix.rid == 'win-x64' }}
      - run: dotnet build Preferis.Windows.slnf -c Release -p:Platform=x64
        if: ${{ matrix.rid == 'win-x64' }}
      - run: dotnet test Preferis.Windows.slnf -c Release --no-build -p:Platform=x64
        if: ${{ matrix.rid == 'win-x64' }}
      # NativeAOT publish, portable zip and Velopack installer, as in build-release.yaml but without the delta
      # package against the previous release (no VelopackRepoUrl) and with the development version 0.1.0.
      - run: dotnet build build/Preferis.Build.proj -t:PackageWindows -p:RuntimeIdentifier=${{ matrix.rid }}
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: Preferis-${{ matrix.rid }}
          path: ./artifacts/${{ matrix.rid }}/release/
          retention-days: 3

  build-macos:
    name: macos (osx-arm64)
    permissions:
      contents: read
    # Apple Silicon, with the Xcode 26 actool that compiles the app icon (build/AppIcon.targets).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      # The picker and the settings are Microsoft.macOS (AppKit) projects.
      - run: dotnet workload install macos
      - run: dotnet build Preferis.MacOS.slnf -c Debug
      - run: dotnet test Preferis.MacOS.slnf -c Debug --no-build
      - run: dotnet build Preferis.MacOS.slnf -c Release
      - run: dotnet test Preferis.MacOS.slnf -c Release --no-build
      # Preferis.app in a dmg, ad-hoc signed; Developer ID signing and notarization belong to build-release.yaml.
      - run: dotnet build build/Preferis.Build.proj -t:PackageMacOS -p:RuntimeIdentifier=osx-arm64
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: Preferis-osx-arm64
          path: ./artifacts/osx-arm64/release/
          retention-days: 3

  # Gantt chart of the jobs in the run summary; runs even when a build failed.
  actions-timeline:
    needs: [build-windows, build-macos]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: Cysharp/Actions/.github/workflows/actions-timeline.yaml@main
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
